      <stop offset="0%" stop-color="#FF9A76"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
  </defs>

  <!-- 배경: 둥근 사각형 -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(71.68,71.68) scale(0.72)">

  <!-- 반짝임 (전구가 켜진 느낌) -->
