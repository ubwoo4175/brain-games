    <line x1="256" y1="74"  x2="256" y2="112"/>
    <line x1="139" y1="122" x2="166" y2="149"/>
    <line x1="373" y1="122" x2="346" y2="149"/>
    <line x1="96"  y1="238" x2="134" y2="238"/>
    <line x1="416" y1="238" x2="378" y2="238"/>
  </g>

  <!-- 전구 유리구 -->
  <circle cx="256" cy="252" r="106" fill="#FFFFFF"/>

  <!-- 전구 목 + 나사 -->
  <rect x="216" y="346" width="80" height="30" rx="12" fill="#FFFFFF"/>
  <rect x="222" y="384" width="68" height="22" rx="11" fill="#FFE8A3"/>
  <rect x="230" y="414" width="52" height="20" rx="10" fill="#FFE8A3"/>

